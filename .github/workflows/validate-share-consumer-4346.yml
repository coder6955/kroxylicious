name: Validate share consumer 4346

on:
  push:
    branches: [validation/share-consumer-4346]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TEST_CLUSTER_EXECUTION_MODE: IN_VM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5f9d66c27cebc07c2a7c37190a41455db8fb1450
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Record environment and source
        run: |
          git rev-parse HEAD
          java -version
          mvn -version
      - name: Build dependencies
        run: |
          mvn -B -ntp -Dtargeted-build \
            '-Pproxy-core,runtime-plugins,supplementary,kubernetes-management,!qa' \
            -pl kroxylicious-integration-test-support -am \
            -DskipTests -Derrorprone.skip=true -Dmaven.javadoc.skip=true \
            -Djapicmp.skip=true install 2>&1 | tee dependency-build.log
      - name: Verify complete integration-test-support module
        run: |
          mvn -B -ntp -Dtargeted-build \
            -Pproxy-core,runtime-plugins,supplementary,kubernetes-management \
            -pl kroxylicious-integration-test-support \
            -DskipITs=true -DskipSTs=true -DskipKTs=true -DskipDTs=true \
            -DskipContainerImageBuild=true -Djapicmp.skip=true \
            verify 2>&1 | tee module-verify.log
          cp -r kroxylicious-integration-test-support/target/surefire-reports module-reports
      - name: Repeat broker-backed share-consumer scenario
        run: |
          for attempt in 1 2 3 4 5; do
            mvn -B -ntp -Dtargeted-build \
              -Pproxy-core,runtime-plugins,supplementary,kubernetes-management \
              -pl kroxylicious-integration-test-support \
              '-Dtest=KroxyliciousTestersTest#testShareConsumerMethods' \
              -Dsurefire.failIfNoSpecifiedTests=true \
              test 2>&1 | tee "share-consumer-${attempt}.log"
            cp -r kroxylicious-integration-test-support/target/surefire-reports "repeat-${attempt}-reports"
          done
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: share-consumer-linux-validation
          retention-days: 3
          path: |
            *.log
            module-reports
            repeat-*-reports
            kroxylicious-integration-test-support/target/surefire-reports
